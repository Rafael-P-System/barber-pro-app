server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # ESSENCIAL para SPA (React / Expo)
        try_files $uri $uri/ /index.html;
    }

    # 🔥 Proxy pro backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
    }

    # Cache (melhora PWA)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}